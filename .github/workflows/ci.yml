name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.0"

jobs:
  quality:
    name: Formatting, linting, and Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: "1.99.0"
          components: clippy, rustfmt

      - name: Install uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python development dependencies
        run: uv sync --locked --all-groups --no-install-project

      - name: Check Python formatting
        run: uv run --no-sync ruff format --check .

      - name: Lint Python
        run: uv run --no-sync ruff check .

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Lint Rust
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --locked

  postgres:
    name: PostgreSQL tests on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: django_native
          POSTGRES_PASSWORD: django_native
          POSTGRES_DB: django_native_postgres_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U django_native -d django_native_postgres_tests"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30

    env:
      DNP_POSTGRES_DB: django_native_postgres_tests
      DNP_POSTGRES_HOST: 127.0.0.1
      DNP_POSTGRES_PASSWORD: django_native
      DNP_POSTGRES_PORT: "5432"
      DNP_POSTGRES_USER: django_native
      DJANGO_NATIVE_POSTGRES_TEST_DATABASE_URL: >-
        postgresql://django_native:django_native@127.0.0.1:5432/django_native_postgres_tests

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: "1.99.0"

      - name: Install uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python development dependencies
        run: uv sync --locked --all-groups --no-install-project

      - name: Build the native extension
        run: uv run --no-sync maturin develop --locked

      - name: Run the complete test suite
        run: uv run --no-sync pytest
