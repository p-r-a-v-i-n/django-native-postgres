name: Release

on:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - CHANGELOG.md
      - Cargo.lock
      - Cargo.toml
      - pyproject.toml
      - tests/wheel_smoke.py
      - uv.lock
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  MATURIN_VERSION: "v1.15.0"
  RUST_VERSION: "1.99.0"
  UV_VERSION: "0.13.0"

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.package-version.outputs.version }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read package version
        id: package-version
        shell: bash
        run: |
          package_version="$(
            python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])'
          )"
          echo "version=$package_version" >> "$GITHUB_OUTPUT"

      - name: Verify release tag
        if: github.event_name == 'push'
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.package-version.outputs.version }}
        run: |
          expected_tag="v${PACKAGE_VERSION}"

          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match $expected_tag"
            exit 1
          fi

          if ! grep -Eq "^## $PACKAGE_VERSION - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "CHANGELOG.md does not contain a dated $PACKAGE_VERSION release"
            exit 1
          fi

      - name: Verify Cargo lock version
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.package-version.outputs.version }}
        run: |
          locked_version="$(
            python3 -c 'import tomllib; packages = tomllib.load(open("Cargo.lock", "rb"))["package"]; print(next(package["version"] for package in packages if package["name"] == "django-native-postgres"))'
          )"

          if [[ "$locked_version" != "$PACKAGE_VERSION" ]]; then
            echo "Cargo.lock version $locked_version does not match $PACKAGE_VERSION"
            exit 1
          fi

  wheels:
    name: Wheel (${{ matrix.platform.name }})
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: manylinux x86-64
            runner: ubuntu-latest
            target: x86_64
            manylinux: "2_17"
            artifact: manylinux-x86-64
          - name: manylinux ARM64
            runner: ubuntu-24.04-arm
            target: aarch64
            manylinux: "2_17"
            artifact: manylinux-aarch64
          - name: macOS Intel
            runner: macos-15-intel
            target: x86_64
            manylinux: "off"
            artifact: macos-x86-64
          - name: macOS Apple Silicon
            runner: macos-15
            target: aarch64
            manylinux: "off"
            artifact: macos-aarch64
          - name: Windows x86-64
            runner: windows-2025
            target: x64
            manylinux: "off"
            artifact: windows-x86-64

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            Cargo.lock
            uv.lock

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          maturin-version: ${{ env.MATURIN_VERSION }}
          rust-toolchain: ${{ env.RUST_VERSION }}
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: --release --locked --compatibility pypi --out dist

      - name: Export the pinned runtime dependencies
        run: >-
          uv export --locked --no-dev --no-emit-project
          --output-file wheel-requirements.txt

      - name: Create wheel test environment
        run: uv venv --python 3.12 .wheel-venv

      - name: Install the pinned runtime dependencies
        run: >-
          uv pip install --python .wheel-venv
          --requirements wheel-requirements.txt

      - name: Install the Psycopg binary implementation
        run: uv pip install --python .wheel-venv "psycopg[binary]>=3.1.12"

      - name: Install the built wheel
        run: >-
          uv pip install --python .wheel-venv --no-deps --no-index
          --find-links dist django-native-postgres

      - name: Smoke-test the built wheel
        run: >-
          uv run --no-project --python .wheel-venv
          python -I tests/wheel_smoke.py

      - name: Upload wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-wheel-${{ matrix.platform.artifact }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  sdist:
    name: Source distribution
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            Cargo.lock
            uv.lock

      - name: Build source distribution
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          maturin-version: ${{ env.MATURIN_VERSION }}
          rust-toolchain: ${{ env.RUST_VERSION }}
          args: --out dist

      - name: Export the pinned runtime dependencies
        run: >-
          uv export --locked --no-dev --no-emit-project
          --output-file sdist-requirements.txt

      - name: Create source distribution test environment
        run: uv venv --python 3.12 .sdist-venv

      - name: Install the pinned runtime dependencies
        run: >-
          uv pip install --python .sdist-venv
          --requirements sdist-requirements.txt

      - name: Install the Psycopg binary implementation
        run: uv pip install --python .sdist-venv "psycopg[binary]>=3.1.12"

      - name: Install the built source distribution
        run: >-
          uv pip install --python .sdist-venv --no-deps dist/*.tar.gz

      - name: Smoke-test the built source distribution
        run: >-
          uv run --no-project --python .sdist-venv
          python -I tests/wheel_smoke.py

      - name: Upload source distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [wheels, sdist]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/p/django-native-postgres
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          skip-existing: true

  verify-testpypi:
    name: Verify TestPyPI package
    needs: [validate, publish-testpypi]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Export the pinned runtime dependencies
        run: >-
          uv export --locked --no-dev --no-emit-project
          --output-file testpypi-requirements.txt

      - name: Create package test environment
        run: uv venv --python 3.12 .testpypi-venv

      - name: Install the pinned runtime dependencies
        run: >-
          uv pip install --python .testpypi-venv
          --requirements testpypi-requirements.txt

      - name: Install the Psycopg binary implementation
        run: >-
          uv pip install --python .testpypi-venv "psycopg[binary]>=3.1.12"

      - name: Install the package from TestPyPI
        env:
          PACKAGE_VERSION: ${{ needs.validate.outputs.version }}
        run: >-
          uv pip install --python .testpypi-venv --no-deps
          --index-url https://test.pypi.org/simple/
          "django-native-postgres==$PACKAGE_VERSION"

      - name: Smoke-test the TestPyPI package
        run: >-
          uv run --no-project --python .testpypi-venv
          python -I tests/wheel_smoke.py

  publish-pypi:
    name: Publish to PyPI
    needs: verify-testpypi
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/django-native-postgres
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/

  github-release:
    name: Create GitHub release
    needs: publish-pypi
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
