[package]
name = "django-native-postgres"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Native asynchronous PostgreSQL execution for Django"
license = "BSD-3-Clause"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
deadpool-postgres = "0.14"
futures-util = "0.3"
pyo3 = { version = "0.29.2", features = ["abi3-py312", "extension-module", "experimental-async"] }
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
tokio-postgres = "0.7"

[lints.rust]
unsafe_code = "forbid"
